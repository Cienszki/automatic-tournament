name: CI

on:
  push:
    branches: [overhaul, feature/multi-tournament-platform, 'wp/**']
  pull_request:
    branches: [overhaul, feature/multi-tournament-platform]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job installs on its own and runs in parallel. Nothing here has a secret: the database jobs
  # use a PostgreSQL container, and the build runs with every secret blank and the network refused.

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations match the table definitions
        run: |
          npm run db:generate
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; echo '::error::src/platform/db/schema changed without a migration: run npm run db:generate and commit drizzle/'; exit 1; }
      - name: Typecheck
        run: npm run typecheck
      - name: Unreachable files
        run: npm run check:unreachable

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and component tests
        run: npx vitest run --project unit --reporter=default --reporter=github-actions

  # Database tests run on PGlite and, through TEST_DATABASE_URL, the catalog and role tests also on
  # a real PostgreSQL 15 (the service below). Tests refuse any URL that is not local. Then the
  # migrations and the seed are applied to the container twice, as a developer would.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database tests (PGlite and PostgreSQL)
        run: npx vitest run --project db --reporter=default --reporter=github-actions
      - name: Migrate and seed PostgreSQL, twice
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/seeded
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database seeded'
          npm run db:migrate
          npm run db:seed
          npm run db:migrate
          npm run db:seed -- --phase seed-liga=finished --phase seed-grupy=finished

  # The production build with every secret blank. scripts/tools/no-network.cjs refuses and records
  # every connection in every build process; the step fails if there is any (WP-03).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with blank secrets and no network
        run: node scripts/tools/build-offline.mjs

  # The lobby bot (bot-worker/). Its tests run with the root's vitest against fakes
  # only: no Steam login, no Firestore, no network. The image is built exactly as
  # Railway builds it, then started far enough to prove the compiled entry points and
  # the protobuf patches are in place. Nothing is pushed or deployed.
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The image runs node:20-slim.
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bot-worker/package-lock.json
      - name: Install the root's dependencies (vitest)
        run: npm ci
      - name: Install the bot's dependencies
        working-directory: bot-worker
        # npm's error lines are repeated as annotations so they show on the run's summary.
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.log || { grep -E 'npm (error|ERR)' npm-ci.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: Apply the image's protobuf patches (node-dota2 cannot load without them)
        working-directory: bot-worker
        run: node setup-local.js
      - name: dist/ is not in git
        run: test -z "$(git ls-files bot-worker/dist)"
      - name: Typecheck
        working-directory: bot-worker
        run: npm run typecheck
      - name: Test
        working-directory: bot-worker
        run: npm test -- --reporter=default --reporter=github-actions
      - name: Build the image
        run: docker build -t bot-worker:ci bot-worker
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint node bot-worker:ci -e "
            for (const f of ['conductor', 'runner', 'inhouse-runner', 'discord-gateway']) require.resolve('./dist/' + f + '.js');
            require('./dist/inhouse/proto-patch.js');
            const D = require('dota2');
            if (D._lobbyOptions.do_player_draft !== 'boolean') { console.error('Immortal Draft patch missing'); process.exit(1); }
            console.log('image OK');
          "
          # Without credentials the Conductor must refuse to start, before any network call.
          set +e
          docker run --rm -e FIREBASE_SERVICE_ACCOUNT_BASE64= bot-worker:ci > conductor.log 2>&1
          code=$?
          set -e
          cat conductor.log
          test "$code" = 1 && grep -q 'FIREBASE_SERVICE_ACCOUNT_BASE64 is not set' conductor.log
