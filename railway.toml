# railway.toml — Railway service configuration for bot-worker
# https://docs.railway.app/reference/config-as-code

[build]
# Use bot-worker/ as the root so Railway only scans its own package-lock.json
# (which has no Next.js dependency and therefore no CVEs)
builder = "dockerfile"
dockerfilePath = "Dockerfile"
rootDirectory = "bot-worker"

[deploy]
# Run the compiled manager (spawns one worker process per enabled bot account)
startCommand = "node dist/manager.js"
healthcheckPath = ""
restartPolicyType = "always"
restartPolicyMaxRetries = 10

# No inbound HTTP port needed — this is a pure worker process
